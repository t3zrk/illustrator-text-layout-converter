<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Illustrator Text Layout Converter</title>
  <desc id="desc">Portfolio hero for an Adobe Illustrator text layout automation utility.</desc>
  <rect width="1600" height="800" fill="#F7F4EE"/>
  <circle cx="1510" cy="65" r="250" fill="#EFE5D3"/>
  <circle cx="30" cy="820" r="260" fill="#F1EBE2"/>

  <rect x="110" y="105" width="95" height="95" rx="24" fill="#1D1B19"/>
