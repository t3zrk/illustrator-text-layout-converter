  <text x="1050" y="392" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2A2827">Row → Column</text>

  <rect x="980" y="434" width="460" height="62" rx="18" fill="#F9F7F3" stroke="#E9E5DF" stroke-width="2"/>
  <circle cx="1015" cy="465" r="11" fill="none" stroke="#9D6F3E" stroke-width="2"/>
