  <text x="110" y="320" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" fill="#181719">Illustrator Text</text>
  <text x="110" y="405" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" fill="#181719">Layout Converter</text>
  <text x="112" y="485" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#65615C">Restructure production copy without rebuilding text frames.</text>

